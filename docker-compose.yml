
services:
  db:
    image: postgres:16-alpine
    container_name: task_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # migrate:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://family_user:family_password@db/family_db
    
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - ./app:/app/app
  #     - ./alembic:/app/alembic

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@task_db/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: supersecretkey_change_me
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # migrate:
      #   condition: service_completed_successfully
    volumes:
      - ./app:/app/app   # для hot-reload при разработке (опционально)
      - ./alembic:/app/alembic


volumes:
  postgres_data:
  redis_data: